name: Sync GlitchTip Issues to GitHub

on:
  push:
    branches: [claude/probe-glitchtip-33-tags]
  schedule:
    # Twice a day, live (not dry-run) — 06:00 and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      org_slug:
        description: "GlitchTip organization slug"
        required: false
        default: "hybrid-memory"
      project_slug:
        description: "GlitchTip project slug"
        required: false
        default: "openclaw-hybrid-memory"
      query:
        description: "GlitchTip issue search query"
        required: false
        default: "is:unresolved"
      dry_run:
        description: "Preview only — do not create GitHub issues or update GlitchTip issue status"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync GlitchTip issues
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_BASE_URL: ${{ secrets.GLITCHTIP_BASE_URL }}
          ORG_SLUG: ${{ inputs.org_slug || 'hybrid-memory' }}
          PROJECT_SLUG: ${{ inputs.project_slug || 'openclaw-hybrid-memory' }}
          QUERY: ${{ inputs.query || 'is:unresolved' }}
          # Scheduled runs are always live; manual dispatch keeps the dry-run-by-default safety net.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/probe-issue-33-tags.mjs
